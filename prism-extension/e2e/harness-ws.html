<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Prism WebSocket harness</title>
</head>
<body>
  <h1>Prism WebSocket harness</h1>
  <p>Opens a WebSocket to the local echo server and sends the composer text via <code>ws.send()</code> — no DOM form submission involved, so only the main-world bridge can protect it.</p>
  <textarea id="ws-input" style="width:90%;height:80px;font-family:monospace"></textarea>
  <br />
  <button id="ws-send">Send via WebSocket</button>
  <div id="ws-log" style="font-family:monospace;white-space:pre-wrap;margin-top:12px"></div>
  <script>
    (() => {
      const input = document.getElementById("ws-input");
      const sendBtn = document.getElementById("ws-send");
      const log = document.getElementById("ws-log");
      let ws = null;

      window.__wsReceived = [];

      async function ensureSocket() {
        // wait for the extension's main-world bridge to be installed
        const t0 = Date.now();
        while (!window.__prismWsPatched && Date.now() - t0 < 6000) {
          await new Promise((r) => setTimeout(r, 100));
        }
        if (ws && ws.readyState === WebSocket.OPEN) return;
        ws = new WebSocket("ws://127.0.0.1:8932");
        await new Promise((resolve, reject) => {
          ws.onopen = resolve;
          ws.onerror = () => reject(new Error("websocket error"));
        });
        ws.onmessage = (e) => {
          const text = String(e.data);
          window.__wsReceived.push(text);
          const div = document.createElement("div");
          div.textContent = text;
          log.appendChild(div);
        };
      }

      sendBtn.addEventListener("click", async () => {
        try {
          await ensureSocket();
        } catch (err) {
          const div = document.createElement("div");
          div.textContent = "WS ERROR: " + err.message;
          log.appendChild(div);
          return;
        }
        const val = input.value;
        ws.send(val);
        input.value = "";
      });
    })();
  </script>
</body>
</html>
